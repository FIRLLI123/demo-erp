<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1ee" />
      <stop offset="100%" stop-color="#fcd8d4" />
    </linearGradient>

    <!-- Headset Gradient -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="80" cy="80" r="78" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4" />

  <!-- Back Hair -->
  <path d="M42 65 C35 85 36 125 45 145 C55 145 105 145 115 145 C124 125 125 85 118 65 Z" fill="url(#hairGrad)" />

  <!-- Body / Shoulder Clothes -->
  <path d="M30 160 C32 132 50 120 70 120 L90 120 C110 120 128 132 130 160 Z" fill="#ffffff" />
  <path d="M52 132 L80 156 L108 132 L95 120 L65 120 Z" fill="#f43f5e" />
  <!-- Inner Collar / ID Badge Pin -->
  <circle cx="80" cy="142" r="3.5" fill="#fbbf24" />

  <!-- Neck -->
  <path d="M68 102 L92 102 L92 122 L68 122 Z" fill="#fbcfe8" opacity="0.6" />
  <path d="M70 98 L90 98 L88 120 L72 120 Z" fill="url(#skinGrad)" />

  <!-- Head Base Shape (Full Face) -->
  <path d="M48 68 C48 42 62 30 80 30 C98 30 112 42 112 68 C112 94 98 108 80 108 C62 108 48 94 48 68 Z" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="48" cy="72" r="6.5" fill="#fbcfe8" />
  <circle cx="112" cy="72" r="6.5" fill="#fbcfe8" />

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="65" cy="68" rx="6" ry="8" fill="#1e1b4b" />
  <circle cx="67" cy="65" r="2.8" fill="#ffffff" />
  <circle cx="63" cy="71" r="1.3" fill="#ffffff" />
  <!-- Left Eyelash -->
  <path d="M58 63 Q65 59 72 63" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Right Eye -->
  <ellipse cx="95" cy="68" rx="6" ry="8" fill="#1e1b4b" />
  <circle cx="97" cy="65" r="2.8" fill="#ffffff" />
  <circle cx="93" cy="71" r="1.3" fill="#ffffff" />
  <!-- Right Eyelash -->
  <path d="M88 63 Q95 59 102 63" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Eyebrows (Friendly Curved) -->
  <path d="M59 55 Q66 51 72 54" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M88 54 Q94 51 101 55" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Cute Nose -->
  <path d="M79 73 Q80 77 82 76" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Blush Cheeks -->
  <ellipse cx="58" cy="78" rx="6.5" ry="3.5" fill="#fb7185" opacity="0.45" />
  <ellipse cx="102" cy="78" rx="6.5" ry="3.5" fill="#fb7185" opacity="0.45" />

  <!-- Sweet Smile -->
  <path d="M72 84 Q80 93 88 84" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="#ffffff" />

  <!-- Front Hair & Bangs (Modern Chic Bob) -->
  <path d="M46 62 C46 36 60 25 80 25 C100 25 114 36 114 62 C114 68 112 76 110 82 C106 72 104 62 101 56 C94 48 84 46 76 46 C66 46 56 50 50 62 C48 68 47 76 46 82 C46 76 46 68 46 62 Z" fill="url(#hairGrad)" />
  <path d="M47 50 C55 36 72 34 82 42 C72 38 58 40 50 48 Z" fill="#6366f1" opacity="0.4" />
  <path d="M113 50 C105 36 88 34 78 42 C88 38 102 40 110 48 Z" fill="#6366f1" opacity="0.4" />

  <!-- Modern Tech Headset / Earphone Assistant -->
  <!-- Headband -->
  <path d="M44 68 C44 32 60 20 80 20 C100 20 116 32 116 68" stroke="url(#headsetGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <!-- Left Earpad -->
  <rect x="40" y="63" width="7" height="15" rx="3.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
  <!-- Right Earpad -->
  <rect x="113" y="63" width="7" height="15" rx="3.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
  <!-- Mic Boom -->
  <path d="M44 75 Q46 92 64 92" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="65" cy="92" r="3" fill="#fb7185" />
  <!-- LED Signal Dot -->
  <circle cx="65" cy="92" r="1.3" fill="#ffffff" />

  <!-- Sparkle Stars Decoration (AI / Magic) -->
  <path d="M26 40 L28 44 L32 46 L28 48 L26 52 L24 48 L20 46 L24 44 Z" fill="#ffffff" opacity="0.9" />
  <path d="M134 46 L135.5 49 L138.5 50.5 L135.5 52 L134 55 L132.5 52 L129.5 50.5 L132.5 49 Z" fill="#ffffff" opacity="0.9" />
  <circle cx="34" cy="62" r="1.8" fill="#ffffff" opacity="0.7" />
  <circle cx="126" cy="36" r="1.5" fill="#ffffff" opacity="0.8" />
</svg>

